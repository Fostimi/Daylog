# Verifie l'application a chaque push, puis la publie sur GitHub Pages.
#
# Les jobs sont separes a dessein :
#
#   verifier / construire -> la sante du code. Ces jobs DOIVENT rester verts.
#   deployer              -> la publication. Il echoue tant que GitHub Pages
#                            n'a pas ete active, ce qui n'a rien a voir avec la
#                            qualite du code.
#
# ACTIVATION, UNE SEULE FOIS :
#   Depot -> Settings -> Pages -> Source : « GitHub Actions »
#
# L'activation automatique (`enablement: true`) a ete tentee puis retiree : le
# jeton fourni aux workflows n'a pas le droit de creer un site Pages, et l'appel
# echouait avec un message trompeur.
#
# Une fois active, l'adresse est https://fostimi.github.io/Daylog/ et se met a
# jour environ une minute apres chaque push.

name: Verification et deploiement

on:
  push:
    branches: ['**']
  workflow_dispatch:

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  verifier:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests unitaires
        run: npm test
      - name: Tests dans dix fuseaux horaires
        run: npm run test:timezones

  construire:
    name: Construction et verification de bout en bout
    needs: verifier
    runs-on: ubuntu-latest
    steps:
      # Historique complet : le numero de version est le nombre reel de
      # modifications du depot, et un clone superficiel le ramenerait a 1.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      # Verification dans un vrai navigateur, y compris le controle qu'aucune
      # requete ne sort de l'application. Si une dependance introduisait un
      # appel reseau, la construction echouerait ici.
      - name: Installer le navigateur de test
        run: npx playwright install --with-deps chromium
      - name: Verification de bout en bout
        run: npm run smoke

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deployer:
    name: Publication (necessite Pages active)
    needs: construire
    # Uniquement depuis la branche par defaut. L'environnement Pages n'accepte
    # de deploiement que depuis elle : sur une branche de travail, ce job
    # echouait systematiquement et affichait une croix rouge alors que les
    # tests et la construction etaient verts. Une CI qui crie au loup a chaque
    # push finit par ne plus etre lue.
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
